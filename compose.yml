name: homecloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homecloud
      POSTGRES_PASSWORD: homecloud
      POSTGRES_DB: homecloud
    ports:
      # Loopback only: the development database is never exposed to the
      # local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecloud -d homecloud"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
