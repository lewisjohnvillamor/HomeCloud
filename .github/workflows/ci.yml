name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    # A wedged job is worse than a failing one: without a ceiling it runs
    # to GitHub's six-hour default, so nobody learns anything for six
    # hours. These are far above what a healthy run takes — minutes, or
    # tens of minutes from a cold cache — and far below a wasted day.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homecloud
          POSTGRES_PASSWORD: homecloud
          POSTGRES_DB: homecloud_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://homecloud:homecloud@127.0.0.1:5432/homecloud_test
    steps:
      - uses: actions/checkout@v4

      # The optional providers, so their tests run for real here rather
      # than skipping. Both are found on PATH at runtime, and a
      # deployment without them works — but CI is the one place that
      # should be exercising the installed path.
      - name: Install optional media and recognition tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      # Caches compilation output only; test results and generated artifacts
      # are never restored, so a cached run cannot hide a real failure.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test

  e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  journeys:
    name: Full-stack journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homecloud
          POSTGRES_PASSWORD: homecloud
          POSTGRES_DB: homecloud_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homecloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOMECLOUD_E2E_DATABASE_URL: postgres://homecloud:homecloud@127.0.0.1:5432/homecloud_e2e
    steps:
      - uses: actions/checkout@v4

      # The optional providers, so their tests run for real here rather
      # than skipping. Both are found on PATH at runtime, and a
      # deployment without them works — but CI is the one place that
      # should be exercising the installed path.
      - name: Install optional media and recognition tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-eng

      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build the API ahead of the journeys
        run: cargo build --bin homecloud-api

      - name: Install Playwright browsers
        run: pnpm --filter @homecloud/web exec playwright install --with-deps chromium

      - name: Run the journeys
        run: pnpm --filter @homecloud/web test:e2e:full

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-report
          path: apps/web/playwright-report/
          retention-days: 7
