[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/media",
    "crates/search",
    "crates/storage",
    "crates/auth",
    "crates/catalog",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lewisjohnvillamor/HomeCloud"

[workspace.dependencies]
homecloud-domain = { path = "crates/domain" }
homecloud-storage = { path = "crates/storage" }
homecloud-auth = { path = "crates/auth" }
homecloud-catalog = { path = "crates/catalog" }
homecloud-media = { path = "crates/media" }
homecloud-search = { path = "crates/search" }

anyhow = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.23"
mime_guess = "2"
percent-encoding = "2.3"
rand = "0.10"
sha2 = "0.11"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
pdf-extract = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
axum = "0.8"
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "time",
    "macros",
    "migrate",
] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "limit", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
debug = 1

# Dependencies are compiled optimised even in development: image decoding
# and resizing are unusably slow otherwise, which would make the test
# suite slow enough that people stop running it.
[profile.dev.package."*"]
opt-level = 2
